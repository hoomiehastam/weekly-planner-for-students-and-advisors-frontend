        <p>
          دانش‌آموزینو پلتفرمی دوطرفه برای داوطلبان کنکور و مشاوران آموزشی است.
          مشاورت برنامه‌ی هفتگی‌ات را می‌سازد، تو در پنل خودت درس‌ها را تیک می‌زنی،

        <h2>ویژگی‌های کلیدی دانش‌آموزینو</h2>
        <ul>
          <li><strong>برنامه‌ی هفتگی دقیق:</strong> بدون سردرگمی، ساعت به ساعت مشخص است چه درسی باید خوانده شود.</li>
          <li><strong>ثبت مطالعه‌ی آزاد:</strong> هر درسی که اضافه بر برنامه خواندی با مشخص کردن بازه زمانی و تست ثبت می‌شود.</li>
          <li><strong>آزمون آنلاین کنکور:</strong> آزمون‌های تستی و تشریحی با تایمر شمارش معکوس و نمره‌دهی خودکار.</li>
          <li><strong>تحلیل و گزارش پیشرفت:</strong> نمودارهای مقایسه‌ای ساعات مطالعه برنامه‌ریزی‌شده در برابر عملکرد واقعی.</li>
